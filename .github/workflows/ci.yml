name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: check that the code is formatted with gofmt
        run: test -z $(gofmt -l . | tee /dev/stderr)

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...
